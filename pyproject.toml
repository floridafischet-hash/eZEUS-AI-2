[project]
name = "ezeus-ai-2"
version = "0.2.0"
description = "Pluginfähige Dokumenten-Workflow- und Analyseplattform für Paperless-ngx"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "redis>=5.2,<6",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "structlog>=24.4,<26",
  "PyYAML>=6.0,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "connectors*", "core*", "plugins*", "webhooks*"]

[project.optional-dependencies]
ocr-paddle = [
  "paddleocr>=3.3,<4",
  "paddlepaddle>=3.2,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "reportlab>=4.2,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
