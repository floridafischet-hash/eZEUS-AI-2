name: Release merged pull request

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-merged-pull-request
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Determine next patch version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$({
            gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/v" \
              --jq '.[].ref | sub("refs/tags/"; "")'
          } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

          if [[ -z "${latest_tag}" ]]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "${version}"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          echo "tag=${next_tag}" >> "${GITHUB_OUTPUT}"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --target "${MERGE_SHA}" \
            --title "${TAG}" \
            --generate-notes
          echo "Released ${TAG} for merged pull request #${PR_NUMBER}."
