name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development environment
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy apps connectors core plugins webhooks
      - name: Tests
        run: python -m pytest
      - name: Python security checks
        run: |
          python -m bandit -q -r apps connectors core plugins scripts webhooks
          python -m pip_audit -r requirements.lock --strict

  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and validate Helm manifests
        run: make helm-check

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --tag ezeus-ai-2:ci .
      - name: Scan repository secrets
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source . --no-banner --redact
      - name: Scan image vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image --scanners vuln --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL ezeus-ai-2:ci
      - name: Generate CycloneDX SBOM
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/work" aquasec/trivy:0.74.0 image
          --format cyclonedx --output /work/ezeus-ai-2.sbom.json ezeus-ai-2:ci
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ezeus-ai-2-sbom
          path: ezeus-ai-2.sbom.json
          if-no-files-found: error
          retention-days: 30
      - name: Compose integration smoke test
        run: make container-smoke
      - name: Clean up integration stack
        if: always()
        run: make smoke-down
