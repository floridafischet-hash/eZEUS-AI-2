name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development environment
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy apps connectors core plugins webhooks
      - name: Tests
        run: python -m pytest
      - name: Python security checks
        run: |
          python -m bandit -q -r apps connectors core plugins scripts webhooks
          python -m pip_audit -r requirements.lock --strict

  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and validate Helm manifests
        run: make helm-check

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: ezeus_migration
          POSTGRES_USER: ezeus
          POSTGRES_PASSWORD: migration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezeus -d ezeus_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development environment
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Test PostgreSQL migration round trip
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://ezeus:migration-test-password@127.0.0.1:5432/ezeus_migration
        run: python -m pytest tests/integration/test_migration_roundtrip.py -q

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --tag ezeus-ai-2:ci .
      - name: Build patched PostgreSQL image
        run: >-
          docker build --tag ezeus-postgres:16.15-gosu1.20-go1.26.10-r1
          --file docker/postgres/Dockerfile .
      - name: Scan repository secrets
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source . --no-banner --redact
      - name: Scan image vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image --scanners vuln --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL ezeus-ai-2:ci
      - name: Scan PostgreSQL image vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image --scanners vuln --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL ezeus-postgres:16.15-gosu1.20-go1.26.10-r1
      - name: Generate CycloneDX SBOM
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/work" aquasec/trivy:0.74.0 image
          --format cyclonedx --output /work/ezeus-ai-2.sbom.json ezeus-ai-2:ci
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ezeus-ai-2-sbom
          path: ezeus-ai-2.sbom.json
          if-no-files-found: error
          retention-days: 30
      - name: Compose integration smoke test
        run: make container-smoke
      - name: Clean up integration stack
        if: always()
        run: make smoke-down
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish patched PostgreSQL image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ezeus-postgres:16.15-gosu1.20-go1.26.10-r1 \
            ghcr.io/floridafischet-hash/ezeus-ai-2-postgres:16.15-gosu1.20-go1.26.10-r1
          docker push \
            ghcr.io/floridafischet-hash/ezeus-ai-2-postgres:16.15-gosu1.20-go1.26.10-r1
