name: Release

# Tags every previously untagged commit on main after the pushed head passed
# CI. This also covers a push containing more than one commit. The next
# version is worked out from each commit's Conventional Commit type:
#
#   feat!: / fix!: / "BREAKING CHANGE:" in the body  → major  (v2.0.0)
#   feat:                                            → minor  (v1.3.0)
#   anything else                                    → patch  (v1.2.1)
#
# There are no unversioned exceptions: docs:, ci:, test: and style: commits
# receive a patch version too. Every commit that reaches main must have one
# exact vMAJOR.MINOR.PATCH tag before it can become a deployable artifact.
#
# The tag is the whole hand-off: GitLab's sync job carries it over, the tag
# pipeline builds, scans and publishes the image as :vX.Y.Z, and Flux rolls out
# minor and patch versions on its own. A new major is built too but not rolled
# out until someone raises the range in the Flux repo's
# apps/prod/eZEUS-AI-2/image-automation.yaml.
#
# Nothing to do by hand here. To release a specific version instead, push the
# tag yourself (git tag v1.4.0 && git push origin v1.4.0) — the next run then
# counts from there.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time: two CI runs finishing close together would otherwise
# both compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Only green CI on a push to main — not on pull requests, whose workflow
    # runs can also carry head_branch main when they come from a fork's main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create version tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          semver_tags() {
            git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          }

          # CI runs can finish out of order. If the globally newest release is
          # not contained in this SHA, a newer main commit was already tagged.
          NEWEST=$(semver_tags | sort -V | tail -n1)
          if [ -n "$NEWEST" ] && ! git merge-base --is-ancestor "$NEWEST" "$SHA"; then
            echo "$NEWEST is not contained in $SHA — older commit, no release."
            exit 0
          fi

          LAST=$(git tag --merged "$SHA" --list \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1 || true)
          VERSION=${LAST#v}
          MAJOR=${VERSION%%.*}; REST=${VERSION#*.}
          MINOR=${REST%%.*};    PATCH=${REST#*.}
          [ -n "$LAST" ] || { MAJOR=0; MINOR=0; PATCH=0; }

          RANGE="${LAST:+$LAST..}$SHA"
          mapfile -t COMMITS < <(git rev-list --reverse "$RANGE")
          TAG_REFS=()
          for COMMIT in "${COMMITS[@]}"; do
            if git tag --points-at "$COMMIT" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "$COMMIT is already versioned."
              continue
            fi

            SUBJECT=$(git log -1 --format='%s' "$COMMIT")
            BODY=$(git log -1 --format='%b' "$COMMIT")
            if printf '%s\n' "$SUBJECT" | grep -Eq '^[a-z]+(\([^)]*\))?!:' \
               || printf '%s\n' "$BODY" | grep -Eq '^BREAKING[ -]CHANGE:'; then
              BUMP=major
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif printf '%s\n' "$SUBJECT" | grep -Eq '^feat(\([^)]*\))?:'; then
              BUMP=minor
              MINOR=$((MINOR + 1)); PATCH=0
            else
              BUMP=patch
              PATCH=$((PATCH + 1))
            fi

            NEXT="v$MAJOR.$MINOR.$PATCH"
            if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
              echo "Refusing to overwrite existing tag $NEXT."
              exit 1
            fi
            git -c tag.gpgSign=false tag "$NEXT" "$COMMIT"
            TAG_REFS+=("refs/tags/$NEXT")
            echo "### $NEXT ($BUMP) on $COMMIT" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "${#TAG_REFS[@]}" -eq 0 ]; then
            echo "All commits through $SHA are already versioned."
            exit 0
          fi
          git push origin "${TAG_REFS[@]}"
