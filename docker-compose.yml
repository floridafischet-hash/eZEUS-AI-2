services:
  api:
    build: .
    command: sh -c "python -m core.db.migrate && exec python -m apps.api"
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ezeus
      POSTGRES_DATABASE: ezeus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example-postgres-password-change-me}
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.getenv('APP_PORT', '8080') + '/ready', timeout=5)\""]
      interval: 15s
      timeout: 6s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  worker:
    build: .
    command: sh -c "python -m core.db.migrate && exec celery -A core.queue.celery_app.celery_app worker -Q high,normal,low --concurrency=$${CELERY_CONCURRENCY:-2} --loglevel=$${APP_LOG_LEVEL:-INFO}"
    init: true
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ezeus
      POSTGRES_DATABASE: ezeus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example-postgres-password-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.queue.celery_app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 2g
    cpus: 2.0

  outbox:
    build: .
    command: sh -c "python -m core.db.migrate && exec python -m core.queue.outbox"
    init: true
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ezeus
      POSTGRES_DATABASE: ezeus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example-postgres-password-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ezeus
      POSTGRES_USER: ezeus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example-postgres-password-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezeus -d ezeus"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7.4.11-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

  paperless:
    build: .
    command: uvicorn apps.mock_paperless.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${MOCK_PAPERLESS_PORT:-18083}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/debug/state', timeout=5)"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

volumes:
  postgres_data:
  redis_data:
