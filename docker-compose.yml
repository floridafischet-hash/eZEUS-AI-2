services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn apps.api.main:app --host $${APP_HOST:-0.0.0.0} --port $${APP_PORT:-8080} --log-level $${APP_LOG_LEVEL:-INFO}"
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.getenv('APP_PORT', '8080') + '/ready', timeout=5)\""]
      interval: 15s
      timeout: 6s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.paddle
    command: sh -c "chown -R ezeus:ezeus /home/ezeus/.paddlex && exec su -s /bin/sh ezeus -c 'celery -A core.queue.celery_app.celery_app worker -Q high,normal,low --loglevel=$${APP_LOG_LEVEL:-INFO}'"
    env_file: .env
    volumes:
      - ocr_models:/home/ezeus/.paddlex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.queue.celery_app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ezeus
      POSTGRES_USER: ezeus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezeus -d ezeus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  paperless:
    build: .
    command: uvicorn apps.mock_paperless.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/debug/state', timeout=5)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  ocr_models:
