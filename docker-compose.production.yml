name: ezeus-ai-2

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python -m core.db.migrate && exec python -m apps.api"
    init: true
    env_file:
      - path: ${EZEUS_ENV_FILE:-.env}
        required: true
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ezeus
      POSTGRES_DATABASE: ezeus
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen3:4b"
      OLLAMA_TIMEOUT_SECONDS: "300"
      OLLAMA_MAX_INPUT_CHARS: "24000"
      OLLAMA_MAX_RESPONSE_BYTES: "1048576"
      OLLAMA_KEEP_ALIVE: "10m"
    ports:
      - "127.0.0.1:${HOST_PORT:-8082}:${APP_PORT:-8080}"
    networks:
      backend:
      paperless:
        aliases:
          - ezeus-ai-2-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.getenv('APP_PORT', '8080') + '/ready', timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python -m core.db.migrate && exec celery -A core.queue.celery_app.celery_app worker -Q high,normal,low --concurrency=$${CELERY_CONCURRENCY:-2} --loglevel=$${APP_LOG_LEVEL:-INFO}"
    init: true
    env_file:
      - path: ${EZEUS_ENV_FILE:-.env}
        required: true
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ezeus
      POSTGRES_DATABASE: ezeus
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen3:4b"
      OLLAMA_TIMEOUT_SECONDS: "300"
      OLLAMA_MAX_INPUT_CHARS: "24000"
      OLLAMA_MAX_RESPONSE_BYTES: "1048576"
      OLLAMA_KEEP_ALIVE: "10m"
    networks:
      - backend
      - paperless
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "celery -A core.queue.celery_app.celery_app inspect ping -d celery@$${HOSTNAME}"
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 2g
    cpus: 2.0

  outbox:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python -m core.db.migrate && exec python -m core.queue.outbox"
    init: true
    env_file:
      - path: ${EZEUS_ENV_FILE:-.env}
        required: true
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ezeus
      POSTGRES_DATABASE: ezeus
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  postgres:
    image: postgres:16.15-alpine
    env_file:
      - path: ${EZEUS_ENV_FILE:-.env}
        required: true
    environment:
      POSTGRES_DB: ezeus
      POSTGRES_USER: ezeus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ezeus -d ezeus"
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7.4.11-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

  ollama:
    image: ollama/ollama:0.32.15
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 4g
    cpus: 3.0
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  ollama_models:

networks:
  backend:
  paperless:
    external: true
    name: ${PAPERLESS_DOCKER_NETWORK:-paperless-ngx_default}
