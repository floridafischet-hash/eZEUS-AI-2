name: ezeus-ai-2

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8080"
    env_file:
      - /home/jarvis/.config/ezeus-ai-2/env
    environment:
      DATABASE_URL: "postgresql+psycopg://ezeus:${POSTGRES_PASSWORD}@postgres:5432/ezeus"
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen3:4b"
      OLLAMA_TIMEOUT_SECONDS: "300"
      OLLAMA_MAX_INPUT_CHARS: "24000"
      OLLAMA_KEEP_ALIVE: "10m"
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      backend:
      paperless:
        aliases:
          - ezeus-ai-2-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core.queue.celery_app.celery_app worker -Q high,normal,low --loglevel=INFO
    env_file:
      - /home/jarvis/.config/ezeus-ai-2/env
    environment:
      DATABASE_URL: "postgresql+psycopg://ezeus:${POSTGRES_PASSWORD}@postgres:5432/ezeus"
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen3:4b"
      OLLAMA_TIMEOUT_SECONDS: "300"
      OLLAMA_MAX_INPUT_CHARS: "24000"
      OLLAMA_KEEP_ALIVE: "10m"
    networks:
      - backend
      - paperless
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "celery -A core.queue.celery_app.celery_app inspect ping -d celery@$${HOSTNAME}"
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    env_file:
      - /home/jarvis/.config/ezeus-ai-2/env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ezeus -d ezeus"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.32.4
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 4g
    cpus: 3.0
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  ollama_models:

networks:
  backend:
  paperless:
    external: true
    name: paperless-ngx_default
