# Two things happen here:
#
# 1. `sync_from_github` fast-forwards GitLab's default branch to GitHub's.
#    It only runs on a schedule or a manual "Run pipeline" — never on push —
#    so committing to this file does not trigger it. It fast-forwards only:
#    if GitLab and GitHub have diverged (e.g. a commit landed directly in
#    GitLab), it aborts without overwriting anything. After such a divergence
#    the job keeps failing until the histories are reconciled by hand.
#
# 2. `quality` / `migrations` / `build` / `scan` produce an image in the
#    project registry, tagged with the commit it was built from, for the Flux
#    deployment in flux/apps/prod/eZEUS-AI-2/deployment.yaml.

stages:
  - sync
  - quality
  - build
  - scan

variables:
  # Pinned like every other image this project pulls (see Makefile). Renovating
  # these is a deliberate change, not something a rebuild does silently.
  PYTHON_IMAGE: python:3.12-slim
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  POSTGRES_IMAGE: postgres:16.15-alpine
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Requires the CI/CD variables GITHUB_TOKEN (GitHub token with read access to
# GITHUB_REPO) and GITLAB_PUSH_TOKEN (a GitLab token, or a project/group access
# token, allowed to push to the default branch) to be configured on this
# project — they are not restored by this file.
sync_from_github:
  stage: sync

  image:
    name: alpine/git:latest
    entrypoint: [""]

  tags:
    - docker

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 0
    GITHUB_REPO: "floridafischet-hash/eZEUS-AI-2"
    SYNC_BRANCH: "main"

  before_script:
    - git config user.name "GitLab Sync Bot"
    - git config user.email "gitlab-sync@localhost"

  script:
    - git remote remove github 2>/dev/null || true

    - >
      git remote add github
      "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

    - git fetch origin "${SYNC_BRANCH}" --prune
    - git fetch github "${SYNC_BRANCH}" --prune --tags

    - GITLAB_SHA="$(git rev-parse "origin/${SYNC_BRANCH}")"
    - GITHUB_SHA="$(git rev-parse "github/${SYNC_BRANCH}")"

    - 'echo "GitLab ${SYNC_BRANCH}: ${GITLAB_SHA}"'
    - 'echo "GitHub ${SYNC_BRANCH}: ${GITHUB_SHA}"'

    - |
      if [ "${GITLAB_SHA}" = "${GITHUB_SHA}" ]; then
        echo "GitHub und GitLab sind bereits synchron."
        exit 0
      fi

    - |
      if git merge-base --is-ancestor "origin/${SYNC_BRANCH}" "github/${SYNC_BRANCH}"; then
        echo "GitLab liegt hinter GitHub. Fast-Forward ist möglich."
      else
        echo "FEHLER: GitHub und GitLab haben unterschiedliche Commit-Verläufe."
        echo "Synchronisierung wird sicherheitshalber abgebrochen."
        echo "Es wird nichts überschrieben."
        exit 1
      fi

    - git checkout -B "${SYNC_BRANCH}" "github/${SYNC_BRANCH}"

    - >
      git push
      "https://gitlab-ci-token:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      "${SYNC_BRANCH}:${SYNC_BRANCH}"

    - >
      git push
      "https://gitlab-ci-token:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      --tags

    - echo "Synchronisierung erfolgreich abgeschlossen."

# Shared by the two Python jobs: the locked dev environment, installed exactly
# the way the Dockerfile installs the runtime one — --require-hashes, so a
# tampered wheel fails the job rather than the deployment.
.python:
  image: $PYTHON_IMAGE
  tags:
    - docker
  cache:
    key:
      files:
        - requirements-dev.lock
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0"
    - python -m pip install --require-hashes -r requirements-dev.lock
    - python -m pip install --no-deps --no-build-isolation .

quality:
  extends: .python
  stage: quality
  timeout: 20m
  script:
    - python -m ruff format --check .
    - python -m ruff check .
    - python -m mypy apps connectors core plugins webhooks
    - python -m pytest
    - python -m bandit -q -r apps connectors core plugins scripts webhooks
    # --strict fails on any advisory without a fix, which is the point: a known
    # vulnerable dependency must not reach the registry.
    - python -m pip_audit -r requirements.lock --strict
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Alembic against a real PostgreSQL, not the SQLite fallback. Worth its own job:
# every pod runs `python -m core.db.migrate` as an init container, so a
# migration that only works on SQLite would take the whole deployment down.
migrations:
  extends: .python
  stage: quality
  timeout: 15m
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  variables:
    POSTGRES_DB: ezeus_migration
    POSTGRES_USER: ezeus
    POSTGRES_PASSWORD: migration-test-password
    MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://ezeus:migration-test-password@postgres:5432/ezeus_migration
  script:
    - python -m pytest tests/integration/test_migration_roundtrip.py -q
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Built with Kaniko, not docker-in-docker: the `docker`-tagged runners are
# unprivileged. dind fails there before it starts — it cannot mount
# /sys/kernel/security, never opens 2375/2376, and the job then dies on a
# missing /certs/client/ca.pem. Kaniko builds from inside an ordinary
# unprivileged container, so no runner configuration has to change.
#
# Kaniko is archived upstream (no releases since 2024), hence the pinned
# version. If it ever has to be replaced, making the runners privileged and
# restoring the dind job is the smaller change; Buildah needs seccomp and
# AppArmor exceptions in the runner config on a Docker executor.
build:
  stage: build
  image:
    name: $KANIKO_IMAGE
    # Without this the executor binary starts instead of a shell and the
    # script section never runs.
    entrypoint: [""]
  tags:
    - docker
  timeout: 45m
  variables:
    # The image Flux pulls. CI_REGISTRY_IMAGE resolves to
    # gitlab.wizard.de:5050/wizard/e-zeus-ai-2 — the address already written
    # into the Deployments.
    IMAGE: $CI_REGISTRY_IMAGE
  before_script:
    # Kaniko has no `docker login`; it reads this file instead.
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
  script:
    # Deliberately no `latest`. The four Deployments (api, worker, outbox,
    # sweeper) must run identical code — a moving tag lets a mid-rollout push
    # split them across two builds after one of them has already migrated the
    # database. The commit SHA is also what the cluster convention uses
    # (ollama-client :711f7768, paperless-orchestrator :bc093343), which makes
    # bumping the tag in the Flux repo the explicit deploy decision.
    #
    # A release tag additionally gets its own immutable tag, so a version can
    # be named in the Flux repo instead of a SHA.
    - |
      DESTINATIONS="--destination $IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTINATIONS="$DESTINATIONS --destination $IMAGE:$CI_COMMIT_TAG"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        $DESTINATIONS
    - echo "Set image to $IMAGE:$CI_COMMIT_SHORT_SHA in flux/apps/prod/eZEUS-AI-2/deployment.yaml"
  rules:
    # Only the default branch and tags produce images. Merge requests run the
    # quality stage but must not publish anything pullable.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Scanned after the push rather than before it, which the dind job could do
# because it had the image locally. Kaniko pushes straight from its build, so
# the only place left to scan it is the registry.
#
# What makes that acceptable here: nothing deploys automatically. Flux pulls
# the tag written in deployment.yaml, and that tag is edited by hand — so a
# red scan means the SHA never gets entered, and the image sits in the
# registry unreferenced.
scan:
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  tags:
    - docker
  timeout: 20m
  variables:
    IMAGE: $CI_REGISTRY_IMAGE
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --scanners vuln --exit-code 1 --ignore-unfixed
      --severity HIGH,CRITICAL "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - trivy image --format cyclonedx --output ezeus-ai-2.sbom.json
      "$IMAGE:$CI_COMMIT_SHORT_SHA"
  artifacts:
    name: ezeus-ai-2-sbom
    paths:
      - ezeus-ai-2.sbom.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
