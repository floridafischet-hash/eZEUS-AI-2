# Two things happen here:
#
# 1. `sync_from_github` fast-forwards GitLab's default branch to GitHub's.
#    It only runs on a schedule or a manual "Run pipeline" — never on push —
#    so committing to this file does not trigger it. It fast-forwards only:
#    if GitLab and GitHub have diverged (e.g. a commit landed directly in
#    GitLab), it aborts without overwriting anything. After such a divergence
#    the job keeps failing until the histories are reconciled by hand.
#
# 2. `quality` / `migrations` / `build` / `scan` produce an image in the
#    project registry, tagged with the commit it was built from, for the Flux
#    deployment in flux/apps/prod/eZEUS-AI-2/deployment.yaml. None of them run
#    on the schedule above — it would otherwise re-test and rebuild the same
#    unchanged commit every time it fires — and `build`/`scan` additionally
#    only run when the commit touched something the image is built from.

stages:
  - sync
  - quality
  - build
  - scan

variables:
  # Pinned like every other image this project pulls (see Makefile). Renovating
  # these is a deliberate change, not something a rebuild does silently.
  PYTHON_IMAGE: python:3.12-slim
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  POSTGRES_IMAGE: postgres:16.15-alpine
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Requires two CI/CD variables on this project, both Protected — the default
# branch is protected, so an unprotected variable would simply be empty here
# and the job would fail at the push with an authentication error:
#   GH_SYNC_TOKEN      fine-grained GitHub PAT on GITHUB_REPO with Contents
#                      and Pull requests set to read/write. Write is needed
#                      for the drift branch below, not for the fast-forward.
#   GITLAB_PUSH_TOKEN  project access token with the Maintainer role and
#                      write_repository — Developer is not enough, the
#                      default branch only accepts pushes from Maintainers.
# They are not restored by this file.
sync_from_github:
  stage: sync

  image:
    name: alpine/git:latest
    entrypoint: [""]

  tags:
    - docker

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # "web" is the Run pipeline button, "api" is POST /projects/:id/pipeline —
    # GitLab treats them as different sources, so a run started with glab or
    # curl needs its own rule. Without it the pipeline comes up without this
    # job at all, which is what happened in #5521.
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 0
    GITHUB_REPO: "floridafischet-hash/eZEUS-AI-2"
    SYNC_BRANCH: "main"

  before_script:
    # The drift handling below talks to the GitHub API; alpine/git ships
    # neither curl nor jq.
    - apk add --no-cache curl jq
    - git config user.name "GitLab Sync Bot"
    - git config user.email "gitlab-sync@localhost"

  script:
    - git remote remove github 2>/dev/null || true

    - >
      git remote add github
      "https://x-access-token:${GH_SYNC_TOKEN}@github.com/${GITHUB_REPO}.git"

    - git fetch origin "${SYNC_BRANCH}" --prune
    - git fetch github "${SYNC_BRANCH}" --prune --tags

    - GITLAB_SHA="$(git rev-parse "origin/${SYNC_BRANCH}")"
    - GITHUB_SHA="$(git rev-parse "github/${SYNC_BRANCH}")"

    - 'echo "GitLab ${SYNC_BRANCH}: ${GITLAB_SHA}"'
    - 'echo "GitHub ${SYNC_BRANCH}: ${GITHUB_SHA}"'

    - |
      if [ "${GITLAB_SHA}" = "${GITHUB_SHA}" ]; then
        echo "GitHub und GitLab sind bereits synchron."
        exit 0
      fi

    - |
      if git merge-base --is-ancestor "origin/${SYNC_BRANCH}" "github/${SYNC_BRANCH}"; then
        echo "GitLab liegt hinter GitHub. Fast-Forward ist möglich."
      else
        echo "WARNUNG: GitLab und GitHub sind auseinandergelaufen."
        echo "Commits, die nur in GitLab liegen:"
        git log --oneline --no-decorate "github/${SYNC_BRANCH}..origin/${SYNC_BRANCH}"

        # Branch name derived from the GitLab SHA, not from a timestamp: as
        # long as GitLab does not move, the name stays the same and the push
        # below is a no-op. With a timestamp the 10-minute schedule would
        # instead open 144 branches a day until the drift is cleaned up.
        DRIFT_BRANCH="gitlab-drift/$(git rev-parse --short "origin/${SYNC_BRANCH}")"
        GITHUB_OWNER="${GITHUB_REPO%%/*}"

        git push github "origin/${SYNC_BRANCH}:refs/heads/${DRIFT_BRANCH}"

        # One PR per drift branch — without this check every run opens another.
        OPEN=$(curl -sS \
          -H "Authorization: Bearer ${GH_SYNC_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPO}/pulls?state=open&head=${GITHUB_OWNER}:${DRIFT_BRANCH}" \
          | jq -r 'length')

        if [ "${OPEN}" = "0" ]; then
          jq -n \
            --arg head "${DRIFT_BRANCH}" \
            --arg base "${SYNC_BRANCH}" \
            --arg sha "${GITLAB_SHA}" \
            '{title: "GitLab-Drift zurückführen (\($head))",
              head: $head, base: $base,
              body: "Automatisch vom GitLab-Sync-Job angelegt.\n\nIn GitLab wurde direkt auf `\($base)` committet (`\($sha)`), wodurch die Historien auseinanderlaufen und der Fast-Forward-Sync blockiert ist.\n\nNach dem Merge dieses PR läuft der Sync von selbst wieder an."}' \
            > /tmp/pr.json
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPO}/pulls" \
            -d @/tmp/pr.json > /dev/null
          echo "Pull Request für ${DRIFT_BRANCH} angelegt."
        else
          echo "Pull Request für ${DRIFT_BRANCH} ist bereits offen."
        fi

        # Deliberately 0, not 1: the job did exactly what it should — it
        # detected the drift and escalated it, and the PR is the durable
        # signal. Exiting 1 would turn one problem into up to 144 red
        # pipelines a day, which nobody keeps looking at.
        echo "Sync übersprungen. Nach dem Merge des PR läuft er wieder an."
        exit 0
      fi

    - git checkout -B "${SYNC_BRANCH}" "github/${SYNC_BRANCH}"

    - >
      git push
      "https://gitlab-ci-token:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      "${SYNC_BRANCH}:${SYNC_BRANCH}"

    - >
      git push
      "https://gitlab-ci-token:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      --tags

    - echo "Synchronisierung erfolgreich abgeschlossen."

# Shared by the two Python jobs: the locked dev environment, installed exactly
# the way the Dockerfile installs the runtime one — --require-hashes, so a
# tampered wheel fails the job rather than the deployment.
.python:
  image: $PYTHON_IMAGE
  tags:
    - docker
  cache:
    key:
      files:
        - requirements-dev.lock
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0"
    - python -m pip install --require-hashes -r requirements-dev.lock
    - python -m pip install --no-deps --no-build-isolation .

quality:
  extends: .python
  stage: quality
  timeout: 20m
  script:
    - python -m ruff format --check .
    - python -m ruff check .
    - python -m mypy apps connectors core plugins webhooks
    - python -m pytest
    - python -m bandit -q -r apps connectors core plugins scripts webhooks
    # --strict fails on any advisory without a fix, which is the point: a known
    # vulnerable dependency must not reach the registry.
    - python -m pip_audit -r requirements.lock --strict
  rules:
    # Not on the sync schedule — it fires on an unchanged default branch.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Alembic against a real PostgreSQL, not the SQLite fallback. Worth its own job:
# every pod runs `python -m core.db.migrate` as an init container, so a
# migration that only works on SQLite would take the whole deployment down.
migrations:
  extends: .python
  stage: quality
  timeout: 15m
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  variables:
    POSTGRES_DB: ezeus_migration
    POSTGRES_USER: ezeus
    POSTGRES_PASSWORD: migration-test-password
    MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://ezeus:migration-test-password@postgres:5432/ezeus_migration
  script:
    - python -m pytest tests/integration/test_migration_roundtrip.py -q
  rules:
    # Not on the sync schedule — it fires on an unchanged default branch.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# `build` and `scan` have to appear or disappear together: scan pulls the tag
# that build pushed, so a scan without a preceding build would fail on an image
# that is not in the registry.
.image-rules:
  rules:
    # A release tag always produces its image, whatever the diff says.
    - if: $CI_COMMIT_TAG
    # `changes` is unusable without a Git push event — GitLab then evaluates it
    # to true. Left in, the sync schedule would rebuild the same commit every
    # time it fires. The same rule makes "Run pipeline" in the UI a deliberate
    # way to force a rebuild of an unchanged commit.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Only the default branch publishes, and only when something that actually
    # ends up in the image changed. The paths below are exactly what the
    # Dockerfile copies; a commit touching only docs, tests or CI leaves the
    # previous image in place — which is still the one the Flux repo points at.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile
        - .dockerignore
        - pyproject.toml
        - requirements.lock
        - alembic.ini
        - apps/**/*
        - connectors/**/*
        - core/**/*
        - infrastructure/**/*
        - plugins/**/*
        - scripts/**/*
        - webhooks/**/*
        - tests/fixtures/invoice.pdf

# Asks the registry whether this commit's tag already exists, and hands the
# answer to `build` as a dotenv variable. It runs a stage earlier because the
# Kaniko image has no HTTP client and no package manager to add one, while
# $PYTHON_IMAGE is already pinned and urllib needs no install.
#
# allow_failure is the important part: if the registry is unreachable — the
# 405 in pipeline #5499 showed that happens — this job going red must not
# block the build. IMAGE_EXISTS then stays unset and `build` builds as before.
image_check:
  extends: .image-rules
  stage: quality
  image: $PYTHON_IMAGE
  tags:
    - docker
  timeout: 5m
  allow_failure: true
  script:
    - |
      python - <<'PY'
      import base64, json, os, urllib.error, urllib.request

      repo = os.environ["CI_REGISTRY_IMAGE"].split("/", 1)[1]
      tag = os.environ["CI_COMMIT_SHORT_SHA"]

      basic = base64.b64encode(
          "{}:{}".format(
              os.environ["CI_REGISTRY_USER"], os.environ["CI_REGISTRY_PASSWORD"]
          ).encode()
      ).decode()

      # The registry itself only speaks bearer tokens; GitLab issues them here.
      auth = urllib.request.Request(
          "https://{}/jwt/auth?service=container_registry"
          "&scope=repository:{}:pull".format(os.environ["CI_SERVER_HOST"], repo),
          headers={"Authorization": "Basic " + basic},
      )
      token = json.load(urllib.request.urlopen(auth, timeout=30))["token"]

      manifest = urllib.request.Request(
          "https://{}/v2/{}/manifests/{}".format(os.environ["CI_REGISTRY"], repo, tag),
          method="HEAD",
          headers={
              "Authorization": "Bearer " + token,
              # Without these the registry answers 404 even for a tag that is
              # there, because it defaults to the v1 manifest type.
              "Accept": ", ".join([
                  "application/vnd.oci.image.index.v1+json",
                  "application/vnd.oci.image.manifest.v1+json",
                  "application/vnd.docker.distribution.manifest.list.v2+json",
                  "application/vnd.docker.distribution.manifest.v2+json",
              ]),
          },
      )

      try:
          urllib.request.urlopen(manifest, timeout=30)
          exists = True
      except urllib.error.HTTPError as err:
          # Only a clean 404 means "not built yet". Anything else is a real
          # problem and should surface instead of being read as "not there".
          if err.code != 404:
              raise
          exists = False

      print("{}:{} bereits in der Registry: {}".format(repo, tag, exists))
      with open("image.env", "w") as handle:
          handle.write("IMAGE_EXISTS={}\n".format("true" if exists else "false"))
      PY
  artifacts:
    reports:
      dotenv: image.env

# Built with Kaniko, not docker-in-docker: the `docker`-tagged runners are
# unprivileged. dind fails there before it starts — it cannot mount
# /sys/kernel/security, never opens 2375/2376, and the job then dies on a
# missing /certs/client/ca.pem. Kaniko builds from inside an ordinary
# unprivileged container, so no runner configuration has to change.
#
# Kaniko is archived upstream (no releases since 2024), hence the pinned
# version. If it ever has to be replaced, making the runners privileged and
# restoring the dind job is the smaller change; Buildah needs seccomp and
# AppArmor exceptions in the runner config on a Docker executor.
build:
  extends: .image-rules
  stage: build
  image:
    name: $KANIKO_IMAGE
    # Without this the executor binary starts instead of a shell and the
    # script section never runs.
    entrypoint: [""]
  tags:
    - docker
  timeout: 45m
  variables:
    # The image Flux pulls. CI_REGISTRY_IMAGE resolves to
    # gitlab.wizard.de:5050/wizard/e-zeus-ai-2 — the address already written
    # into the Deployments.
    IMAGE: $CI_REGISTRY_IMAGE
  before_script:
    # Kaniko has no `docker login`; it reads this file instead.
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
  script:
    # Deliberately no `latest`. The four Deployments (api, worker, outbox,
    # sweeper) must run identical code — a moving tag lets a mid-rollout push
    # split them across two builds after one of them has already migrated the
    # database. The commit SHA is also what the cluster convention uses
    # (ollama-client :711f7768, paperless-orchestrator :bc093343), which makes
    # bumping the tag in the Flux repo the explicit deploy decision.
    #
    # A release tag additionally gets its own immutable tag, so a version can
    # be named in the Flux repo instead of a SHA.
    #
    # Skipped when image_check found the tag already in the registry: the tag
    # *is* the commit SHA, so an existing tag means identical sources. This
    # check sits here and not in `rules` because `changes:` evaluates to true
    # in every pipeline without a Git push event — schedule, web and api — so
    # the rules alone cannot tell an unchanged commit from a changed one.
    # Pipeline #5521 rebuilt an untouched commit for exactly that reason.
    - |
      if [ "$IMAGE_EXISTS" = "true" ] && [ -z "$FORCE_REBUILD" ]; then
        echo "$IMAGE:$CI_COMMIT_SHORT_SHA liegt bereits in der Registry."
        echo "Build übersprungen — FORCE_REBUILD=1 erzwingt einen Neubau."
        exit 0
      fi
    - |
      DESTINATIONS="--destination $IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTINATIONS="$DESTINATIONS --destination $IMAGE:$CI_COMMIT_TAG"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        $DESTINATIONS
    - echo "Set image to $IMAGE:$CI_COMMIT_SHORT_SHA in flux/apps/prod/eZEUS-AI-2/deployment.yaml"

# Scanned after the push rather than before it, which the dind job could do
# because it had the image locally. Kaniko pushes straight from its build, so
# the only place left to scan it is the registry.
#
# What makes that acceptable here: nothing deploys automatically. Flux pulls
# the tag written in deployment.yaml, and that tag is edited by hand — so a
# red scan means the SHA never gets entered, and the image sits in the
# registry unreferenced.
scan:
  extends: .image-rules
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  tags:
    - docker
  timeout: 20m
  variables:
    IMAGE: $CI_REGISTRY_IMAGE
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --scanners vuln --exit-code 1 --ignore-unfixed
      --severity HIGH,CRITICAL "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - trivy image --format cyclonedx --output ezeus-ai-2.sbom.json
      "$IMAGE:$CI_COMMIT_SHORT_SHA"
  artifacts:
    name: ezeus-ai-2-sbom
    paths:
      - ezeus-ai-2.sbom.json
    expire_in: 30 days
