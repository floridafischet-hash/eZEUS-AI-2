{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ezeus.fullname" . }}-postgres
  labels: {{- include "ezeus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ezeus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker, outbox, migrations]
      ports: [{ port: 5432, protocol: TCP }]
{{- end }}
