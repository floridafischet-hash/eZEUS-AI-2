{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ezeus.fullname" . }}-api
  labels: {{- include "ezeus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ezeus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ezeus.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports: [{ port: 5432, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels:
              {{- include "ezeus.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis
      ports: [{ port: 6379, protocol: TCP }]
    - to:
        - podSelector:
            matchLabels:
              {{- include "ezeus.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: ollama
      ports: [{ port: 11434, protocol: TCP }]
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.egressCidrs }}
    # External egress (Paperless or managed services), explicitly operator-scoped.
    - to:
        {{- range .Values.networkPolicy.egressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 11434
          protocol: TCP
    {{- end }}
