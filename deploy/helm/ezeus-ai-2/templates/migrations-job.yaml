{{- if and .Values.migrations.helmHookEnabled .Values.postgres.enabled -}}
{{- fail "migrations.helmHookEnabled requires postgres.enabled=false; use init migrations with internal PostgreSQL" -}}
{{- end -}}
{{- if and .Values.migrations.helmHookEnabled (not .Values.migrations.enabled) -}}
{{- fail "migrations.helmHookEnabled requires migrations.enabled=true for a safe initial install" -}}
{{- end -}}
{{- if .Values.migrations.helmHookEnabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ezeus.fullname" . }}-migrations-{{ .Release.Revision }}
  labels:
    {{- include "ezeus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ezeus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "ezeus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: alembic
          image: {{ include "ezeus.imageRef" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "core.db.migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "ezeus.fullname" . }}-config
            - secretRef:
                name: {{ include "ezeus.secretName" . }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
{{- end }}
