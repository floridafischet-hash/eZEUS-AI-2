apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ezeus.fullname" . }}-config
  labels: {{- include "ezeus.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
  {{- if .Values.external.databaseUrl }}
  DATABASE_URL: {{ .Values.external.databaseUrl | quote }}
  {{- else if .Values.postgres.enabled }}
  POSTGRES_HOST: {{ include "ezeus.postgresHost" . | quote }}
  POSTGRES_PORT: "5432"
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_DATABASE: {{ .Values.postgres.auth.database | quote }}
  {{- end }}
  REDIS_URL: {{ include "ezeus.redisUrl" . | quote }}
  OLLAMA_BASE_URL: {{ include "ezeus.ollamaBaseUrl" . | quote }}
  {{- if .Values.external.paperlessBaseUrl }}
  PAPERLESS_BASE_URL: {{ .Values.external.paperlessBaseUrl | quote }}
  {{- end }}
  {{- if .Values.external.publicWebhookBaseUrl }}
  PUBLIC_WEBHOOK_BASE_URL: {{ .Values.external.publicWebhookBaseUrl | quote }}
  {{- end }}
