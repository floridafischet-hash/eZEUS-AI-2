# Example production overrides for eZEUS-AI-2.
# Copy to values-production.yaml, adjust, then:
#   helm upgrade --install ezeus deploy/helm/ezeus-ai-2 -n ezeus --create-namespace -f values-production.yaml

image:
  repository: ghcr.io/floridafischet-hash/ezeus-ai-2
  tag: "0.2.0"

api:
  replicaCount: 3
  hpa: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }

worker:
  replicaCount: 3
  hpa: { enabled: true, minReplicas: 3, maxReplicas: 12, targetCPUUtilizationPercentage: 75 }

config:
  OUTBOUND_ALLOWED_HOSTS: paperless.company.example,ollama

# Use an out-of-cluster PostgreSQL, e.g. managed database.
postgres:
  enabled: false
external:
  # Put DATABASE_URL in the existing Secret; never put credentials in this file.
  databaseUrl: ""
  paperlessBaseUrl: https://paperless.company.example
  publicWebhookBaseUrl: https://ezeus.company.example

# In-cluster Redis + Ollama stay enabled.
existingSecret: ezeus-secrets   # Sealed/External Secret provisioned separately

migrations:
  enabled: true
  helmHookEnabled: true   # safe here because the external database already exists

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ezeus.company.example
      paths: [{ path: /, pathType: Prefix }]
  tls:
    - secretName: ezeus-tls
      hosts: [ezeus.company.example]

oauth2Proxy:
  enabled: true
  provider: oidc
  oidcIssuerUrl: https://sso.company.example
  clientId: ezeus

networkPolicy:
  enabled: true
  allowedIngressNamespaces: [ingress-nginx]
  # Restrict these to the managed PostgreSQL, Paperless and OIDC provider ranges.
  egressCidrs:
    - 203.0.113.0/24
